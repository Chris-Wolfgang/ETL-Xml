name: Scorecard supply-chain security

# OSSF Scorecard (#144): scores the repository's security posture (branch
# protection, pinned dependencies, dangerous-workflow patterns, token
# permissions, ...) against ~20 best practices and uploads the result to the
# code-scanning / Security tab. Distinct from CodeQL — Scorecard grades the repo
# *configuration*, not the source code. publish_results powers the README badge.

on:
  # Re-score when branch-protection rules change (a common posture regression).
  branch_protection_rule:
  schedule:
    - cron: '20 7 * * 1'   # weekly, Monday 07:20 UTC
  push:
    branches:
      - main

# Top-level least privilege; the analysis job opts into exactly what it needs.
permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # upload the SARIF result to code-scanning
      id-token: write          # publish to the OpenSSF API (badge + transparency log)
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # Publish to the OpenSSF transparency log so the README badge resolves.
          publish_results: true

      # TEMPORARY WORKAROUND — pending upstream ossf/scorecard support for
      # .NET fuzzing frameworks. Filter documented false-positive rules out
      # of the SARIF before it reaches code-scanning. Doing it here (rather
      # than dismissing the individual alerts) is durable across weekly
      # re-runs — Scorecard emits a fresh SARIF each run and fingerprint
      # drift means per-alert dismissals decay (see
      # reference_scorecard_dismissal_not_durable).
      #
      # Suppressed rule IDs:
      #   FuzzingID  — this repo ships CsCheck-based fuzz tests in
      #                tests/Wolfgang.Etl.Xml.Tests.Fuzz + fuzz.yaml, but
      #                Scorecard's fuzzing heuristic only recognizes
      #                OSS-Fuzz, ClusterFuzzLite, Go native fuzz, Python
      #                atheris, Java Jazzer, Haskell QuickCheck, and
      #                OneFuzz — none of which support .NET/C#. A real fix
      #                requires ossf/scorecard to add a C# fuzzing
      #                detector (CsCheck, SharpFuzz, DotnetFuzzing). When
      #                that lands upstream, remove this filter entry.
      #
      # The scorecard.dev score published to the transparency log (README
      # badge) still counts every check; this only trims the code-scanning-
      # tab noise.
      - name: Filter documented false positives from SARIF
        shell: bash
        env:
          SUPPRESSED_RULES: 'FuzzingID'
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            echo "::error::jq not available on the runner; cannot filter SARIF."
            exit 1
          fi
          # shellcheck disable=SC2086
          rules_json=$(printf '%s\n' $SUPPRESSED_RULES | jq -R . | jq -s .)
          jq \
            --argjson suppressed "$rules_json" \
            '
              .runs |= map(
                .results |= map(select(
                  ($suppressed | index(.ruleId // "")) == null
                ))
              )
            ' results.sarif > results.filtered.sarif
          before=$(jq '[.runs[].results[]] | length' results.sarif)
          after=$(jq '[.runs[].results[]] | length' results.filtered.sarif)
          echo "Scorecard SARIF results: $before -> $after after suppression"
          mv results.filtered.sarif results.sarif

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          sarif_file: results.sarif
